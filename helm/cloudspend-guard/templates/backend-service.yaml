apiVersion: v1
kind: Service
metadata:
  name: cloudspend-backend
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-backend
    app.kubernetes.io/part-of: cloudspend-guard
spec:
  type: {{ .Values.backend.service.type }}

  selector:
    app.kubernetes.io/name: cloudspend-backend

  ports:
    - name: http
      port: {{ .Values.backend.service.port }}
      targetPort: http
      protocol: TCP