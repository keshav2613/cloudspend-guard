apiVersion: v1
kind: Service
metadata:
  name: cloudspend-frontend
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-frontend
    app.kubernetes.io/part-of: cloudspend-guard
spec:
  type: {{ .Values.frontend.service.type }}

  selector:
    app.kubernetes.io/name: cloudspend-frontend

  ports:
    - name: http
      port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP