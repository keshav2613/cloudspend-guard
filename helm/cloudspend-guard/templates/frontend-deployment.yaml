apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudspend-frontend
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-frontend
    app.kubernetes.io/part-of: cloudspend-guard
spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: cloudspend-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudspend-frontend
        app.kubernetes.io/part-of: cloudspend-guard

    spec:
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}