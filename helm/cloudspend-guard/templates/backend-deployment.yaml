apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudspend-backend
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-backend
    app.kubernetes.io/part-of: cloudspend-guard
spec:
  replicas: {{ .Values.backend.replicaCount }}

  selector:
    matchLabels:
      app.kubernetes.io/name: cloudspend-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudspend-backend
        app.kubernetes.io/part-of: cloudspend-guard

    spec:
      serviceAccountName: {{ .Values.serviceAccount.backend.name }}

      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}

          ports:
            - name: http
              containerPort: 8000
              protocol: TCP

          env:
            - name: AWS_REGION
              value: {{ .Values.aws.region | quote }}

            - name: ENVIRONMENT
              value: "production"

          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 20
            failureThreshold: 3

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}