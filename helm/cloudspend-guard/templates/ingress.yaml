{{- if .Values.ingress.enabled }}

# Backend Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudspend-guard-backend
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-guard
  annotations:
    alb.ingress.kubernetes.io/group.name: cloudspend-guard
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/healthcheck-path: /api/v1/health
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: cloudspend-backend
                port:
                  number: 8000

---

# Frontend Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudspend-guard-frontend
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-guard
  annotations:
    alb.ingress.kubernetes.io/group.name: cloudspend-guard
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/healthcheck-path: /
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudspend-frontend
                port:
                  number: 80

{{- end }}