{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudspend-guard
  namespace: cloudspend
  labels:
    app.kubernetes.io/name: cloudspend-guard
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - http:
        paths:
          - path: /api/v1
            pathType: Prefix
            backend:
              service:
                name: cloudspend-backend
                port:
                  number: 8000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: cloudspend-frontend
                port:
                  number: 80
{{- end }}